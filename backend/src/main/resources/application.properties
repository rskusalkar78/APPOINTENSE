spring.application.name=appointment-booking-backend

# Server Configuration
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration using Environment Variables with Localhost Defaults
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:appointment_booking}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Rohan@MySQL2026!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
# JWT_SECRET must be at least 32 characters long
jwt.secret=${JWT_SECRET:OnlineAppointmentBookingSystemSecretKeyForLocalDevelopment2026!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
