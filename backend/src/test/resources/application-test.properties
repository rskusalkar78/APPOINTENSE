# Test Configuration for Isolated Test Execution (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:appointment_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Test JWT Secret (at least 32 characters, test-only)
jwt.secret=TestSecretKeyForTestingPurposesMustBeAtLeast32CharsLong!
jwt.expiration-ms=3600000
